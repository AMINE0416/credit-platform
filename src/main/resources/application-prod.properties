# Configuration Production pour Render

# Base de données
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA en production : ne pas modifier la structure
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Configuration serveur
server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# Compression des réponses
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:7200000}

# CORS - Autoriser uniquement les domaines de production
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging en production
logging.level.root=WARN
logging.level.org.eqdom.creditplatform=INFO
logging.level.org.springframework.security=WARN

# Désactiver Swagger en production (optionnel)
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false
