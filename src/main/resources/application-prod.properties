# Configuration Production pour Railway/Render avec PostgreSQL

# Base de données PostgreSQL
# Railway fournit DATABASE_URL directement (format PostgreSQL complet)
# Render peut nécessiter DB_USERNAME et DB_PASSWORD séparés
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA en production : update pour créer les tables au premier déploiement
# Après le premier déploiement réussi, vous pouvez changer en "validate" pour plus de sécurité
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration serveur
# Railway utilise la variable PORT, on supporte aussi SERVER_PORT pour Render
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

# Compression des réponses
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:7200000}

# CORS - Autoriser uniquement les domaines de production
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging en production
logging.level.root=WARN
logging.level.org.eqdom.creditplatform=INFO
logging.level.org.springframework.security=WARN

# Désactiver Swagger en production (optionnel)
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false
