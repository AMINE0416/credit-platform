# Configuration Production pour Railway/Render avec PostgreSQL

# ============================================
# Base de données PostgreSQL
# ============================================
# Railway peut fournir DATABASE_URL (format complet) ou variables séparées
# Si DATABASE_URL n'est pas définie, on utilise PGHOST, PGPORT, PGDATABASE
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:}}

# Pool de connexions optimisé (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================
# JPA/Hibernate Performance
# ============================================
# JPA en production : update pour créer les tables au premier déploiement
# Après le premier déploiement réussi, vous pouvez changer en "validate" pour plus de sécurité
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Batch insert/update pour améliorer les performances (optimisé pour import Excel)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Optimisations supplémentaires pour les gros imports
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ============================================
# Configuration serveur Tomcat
# ============================================
# Railway utilise la variable PORT, on supporte aussi SERVER_PORT pour Render
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

# Optimisation des threads
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000

# Compression des réponses HTTP
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# JWT Configuration
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:7200000}

# ============================================
# CORS - Autoriser uniquement les domaines de production
# ============================================
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}

# ============================================
# Actuator (Health Check)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true

# ============================================
# Logging en production
# ============================================
logging.level.root=WARN
logging.level.org.eqdom.creditplatform=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# Cache Configuration
# ============================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# ============================================
# Désactiver Swagger en production (optionnel)
# ============================================
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false

