spring.application.name=credit_platform

# Configuration Base de Données - Utilise des variables d'environnement
spring.datasource.url=jdbc:mysql://localhost:3306/credit_platform
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:aminux}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration serveur - Accès réseau local
server.port=8081
server.address=0.0.0.0

# Sécurité JWT - Secret et expiration via variables d'environnement
jwt.secret=${JWT_SECRET:4fd3f78d8d8c4ab7e65f1b9c2a8e7d4c9b6f3a1e5d8c7f2b9a4e6d1f8c3b7a5e}
jwt.expiration-ms=${JWT_EXPIRATION:7200000}
# Valeur par défaut: 7200000 ms = 2 heures (anciennement 24h = 86400000ms)
# Pour production, définir JWT_EXPIRATION=3600000 (1h) ou JWT_EXPIRATION=7200000 (2h)

# CORS - Patterns d'origines autorisées (utilise variables d'environnement)
# Patterns pour autoriser localhost et réseau local
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Spring Boot Actuator (pour health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Configuration du Logging
# Niveau de log global
logging.level.root=INFO

# Logs détaillés pour le package eqdom (recommandé pour développement)
logging.level.org.eqdom.creditplatform=INFO

# Logs SQL Hibernate (décommenter pour debug SQL)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security (décommenter pour debug authentification)
# logging.level.org.springframework.security=DEBUG

# Fichier de log (optionnel - décommenter pour activer)
# logging.file.name=logs/credit-platform.log
# logging.file.max-size=10MB
# logging.file.max-history=30
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n