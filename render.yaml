services:
  # Backend Spring Boot
  - type: web
    name: credit-platform-api
    runtime: docker
    plan: free
    # Ou plan: starter pour un service payant plus performant
    
    # Configuration du build
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Configuration de l'environnement
    envVars:
      - key: SERVER_PORT
        value: 8081
      
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m -Dspring.profiles.active=prod"
      
      # Base de données PostgreSQL - Render fournit automatiquement DATABASE_URL
      - key: DATABASE_URL
        fromDatabase:
          name: credit-platform-db
          property: connectionString
      
      # Ces variables sont optionnelles si DATABASE_URL est utilisé
      # Mais peuvent être utiles pour des configurations avancées
      - key: DB_USERNAME
        fromDatabase:
          name: credit-platform-db
          property: user
      
      - key: DB_PASSWORD
        fromDatabase:
          name: credit-platform-db
          property: password
      
      # JWT - IMPORTANT: Générer un nouveau secret sécurisé
      - key: JWT_SECRET
        sync: false  # À définir manuellement dans Render Dashboard (sensible)
      
      - key: JWT_EXPIRATION
        value: 7200000  # 2 heures
      
      # CORS - URL de votre frontend Vercel
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app,https://your-app-*.vercel.app
    
    # Health check
    healthCheckPath: /actuator/health
    
    # Auto-deploy depuis la branche main
    autoDeploy: true
    branch: main

  # Base de données PostgreSQL
  - type: pgsql
    name: credit-platform-db
    plan: free
    databaseName: credit_platform
    user: credit_user
    ipAllowList: []  # Vide = accessible depuis tous les services Render
