services:
  # Backend Spring Boot
  - type: web
    name: credit-platform-api
    runtime: docker
    plan: free
    # Ou plan: starter pour un service payant plus performant
    
    # Configuration du build
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Configuration de l'environnement
    envVars:
      - key: SERVER_PORT
        value: 8081
      
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m -Dspring.profiles.active=prod"
      
      # Base de données - À configurer avec votre base MySQL sur Render
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://YOUR_DB_HOST:3306/credit_platform?useSSL=true&requireSSL=true&serverTimezone=UTC
      
      - key: DB_USERNAME
        sync: false  # À définir manuellement dans Render Dashboard
      
      - key: DB_PASSWORD
        sync: false  # À définir manuellement dans Render Dashboard (sensible)
      
      # JWT - IMPORTANT: Générer un nouveau secret sécurisé
      - key: JWT_SECRET
        sync: false  # À définir manuellement dans Render Dashboard (sensible)
      
      - key: JWT_EXPIRATION
        value: 7200000  # 2 heures
      
      # CORS - URL de votre frontend Vercel
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app,https://your-app-*.vercel.app
    
    # Health check
    healthCheckPath: /actuator/health
    
    # Auto-deploy depuis la branche main
    autoDeploy: true
    branch: main

  # Base de données MySQL (optionnel si vous utilisez un service externe)
  # - type: database
  #   name: credit-platform-db
  #   engine: mysql
  #   plan: free
  #   databaseName: credit_platform
  #   user: credit_user
